name: Publish

# Build sdist+wheel and upload to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC): no API token or stored secret.
# One-time PyPI setup (project does not exist yet, so add a "pending publisher"):
#   PyPI -> Your projects / Publishing -> add a pending publisher with
#     PyPI project name: interleave-test
#     Owner:             Therealdk8890
#     Repository:        interleave-test
#     Workflow name:     publish.yml
#     Environment:       pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
