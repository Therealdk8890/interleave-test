name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the free-threaded (no-GIL) build — the headline target.
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Show interpreter (and GIL state on free-threaded builds)
        run: |
          python -c "import sys; g=getattr(sys,'_is_gil_enabled',lambda:True)(); print(sys.version); print('GIL enabled:', g)"

      - name: Run tests
        run: pytest -q
